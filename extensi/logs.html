<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kamus Mini — Riwayat soal</title><link rel="stylesheet" href="ui-system.css"><link rel="stylesheet" href="logs.css"><script src="theme.js"></script></head><body><main>
<header><div><h1>Riwayat soal</h1><p>Jawaban, waktu proses, dan sumber gambar dalam satu tempat.</p></div><div class="actions"><button id="theme">Tema</button><button id="refresh">Muat ulang</button><button id="copy">Salin</button><button id="export">Ekspor</button><button id="clear">Hapus log</button></div></header>
<div class="filters"><label>Cari soal atau jawaban<input id="search" type="search" placeholder="Nomor, jawaban, atau mode…"></label><label>Status<select id="status"><option value="">Semua</option><option value="success">Berhasil</option><option value="error">Gagal</option><option value="running">Berjalan</option></select></label><label>Tahapan<select id="stage"><option value="">Semua</option><option value="CAPTURE">Capture</option><option value="OCR">OCR</option><option value="AI">AI</option><option value="WARN">Warn / Error</option></select></label><a href="logs-legacy.html">Log lama / kompatibilitas</a></div>
<p id="feedback" role="status"></p><div class="workspace"><nav id="questions" aria-label="Riwayat per soal"></nav><section id="detail" aria-live="polite"><h2>Belum ada riwayat soal</h2><p>Jalankan agen untuk melihat ringkasan. Riwayat versi lama tetap tersedia melalui tautan kompatibilitas.</p></section></div>
<dialog id="preview"><button id="closePreview">Tutup preview</button><img id="largeImage" alt="Screenshot area soal"></dialog></main><script src="logs.js"></script></body></html>
