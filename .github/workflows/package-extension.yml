name: Package extension

on:
  push:
    branches: [main]
    paths:
      - 'extensi/**'
      - 'tests/**'
      - '.github/workflows/package-extension.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new immutable release for the manifest version
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test extension regressions
        run: node --test tests/extension-regressions.test.cjs

      - name: Read manifest version
        id: meta
        run: |
          VERSION=$(node -p "require('./extensi/manifest.json').version")
          if [ -z "$VERSION" ]; then echo "manifest version missing" >&2; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Validate manifest & core files
        run: |
          node -e "const m=require('./extensi/manifest.json'); if(m.manifest_version!==3) throw new Error('manifest_version must be 3'); if(!/^[0-9]+\.[0-9]+(\.[0-9]+)?$/.test(m.version)) throw new Error('version must be X.Y or X.Y.Z: '+m.version)"
          test -f extensi/background.js
          test -f extensi/options.html
          test -f extensi/popup.html

      - name: Build zip and checksum
        run: |
          git ls-files -z -- extensi/ | python3 -c '
          import json, pathlib, sys, zipfile
          version = json.loads(pathlib.Path("extensi/manifest.json").read_text())["version"]
          tracked = sys.stdin.buffer.read().decode().rstrip(chr(0)).split(chr(0))
          root = pathlib.Path("extensi")
          with zipfile.ZipFile(f"kamus-mini-{version}.zip", "w", zipfile.ZIP_DEFLATED) as bundle:
              for name in sorted(tracked):
                  path = pathlib.Path(name)
                  entry = path.relative_to(root)
                  for part in entry.parts:
                      if part.startswith((".", "Daftar_Siswa_")) or part == "private-data":
                          raise ValueError("Private path in distribution files")
                  if path.is_symlink():
                      raise ValueError("Symlink in distribution files")
                  bundle.write(path, entry.as_posix())
          '
          ZIP="kamus-mini-$VERSION.zip"
          unzip -tq "$ZIP"
          test "$(unzip -p "$ZIP" manifest.json | jq -r .version)" = "$VERSION"
          sha256sum "$ZIP" > "$ZIP.sha256"
          sha256sum -c "$ZIP.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: kamus-mini-${{ steps.meta.outputs.version }}
          path: kamus-mini-${{ steps.meta.outputs.version }}.zip*

      - name: Publish new release and verify downloads
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          ZIP="kamus-mini-$VERSION.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Existing assets are preserved." >&2
            exit 1
          fi
          existing="$(git ls-remote --tags origin "refs/tags/$TAG")"
          if [ -n "$existing" ]; then
            echo "Tag $TAG already exists. Use a new manifest version." >&2
            exit 1
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Kamus Mini $VERSION" \
            --notes "$(printf '%s\n' '- Mode Saran menunggu klik sebelum menerapkan jawaban ke soal yang sama.' '- Diagnostik Cloud menampilkan akses akun, identitas siswa, tenggat dan konfigurasi model tanpa memakai token.' '- Kontrak v3 membedakan hasil bank dari jawaban AI yang belum diperiksa.')" \
            "$ZIP" "$ZIP.sha256"
          mkdir verified-release
          gh release download "$TAG" --dir verified-release --pattern "$ZIP" --pattern "$ZIP.sha256"
          (cd verified-release && sha256sum -c "$ZIP.sha256" && unzip -tq "$ZIP")
          cmp "$ZIP" "verified-release/$ZIP"
